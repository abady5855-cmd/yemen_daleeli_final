name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Yemen Daleeli Android
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. تحميل المشروع
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. إعداد Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # --------------------------------------------------
      # 3. إعداد Flutter 3.22.0
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true


      # --------------------------------------------------
      # 4. التحقق من Flutter
      # --------------------------------------------------
      - name: Verify Flutter
        run: |
          flutter --version
          dart --version


      # --------------------------------------------------
      # 5. إنشاء google-services.json من Secret
      # --------------------------------------------------
      - name: Create Firebase Config File
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        shell: bash
        run: |
          set -e

          echo "Checking Firebase secret..."

          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo "ERROR: FIREBASE_CONFIG_JSON secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$FIREBASE_CONFIG_JSON" > android/app/google-services.json

          echo "Firebase file created."


      # --------------------------------------------------
      # 6. التحقق من أن Firebase JSON صالح
      # --------------------------------------------------
      - name: Validate Firebase JSON
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")

          print("Validating google-services.json...")

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as e:
              print("ERROR: google-services.json is NOT valid JSON.")
              print(f"Details: {e}")
              raise SystemExit(1)

          if not isinstance(data, dict):
              print("ERROR: Firebase JSON root must be an object.")
              raise SystemExit(1)

          required_keys = [
              "project_info",
              "client"
          ]

          for key in required_keys:
              if key not in data:
                  print(
                      f"ERROR: Missing required Firebase key: {key}"
                  )
                  raise SystemExit(1)

          print("Firebase JSON validation passed.")
          PY


      # --------------------------------------------------
      # 7. تثبيت Dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: flutter pub get


      # --------------------------------------------------
      # 8. تحليل المشروع
      # --------------------------------------------------
      - name: Analyze code
        run: flutter analyze


      # --------------------------------------------------
      # 9. تشغيل الاختبارات
      # --------------------------------------------------
      - name: Run tests
        run: flutter test


      # --------------------------------------------------
      # 10. تنظيف المشروع
      # --------------------------------------------------
      - name: Flutter clean
        run: flutter clean


      # --------------------------------------------------
      # 11. إعادة تثبيت Dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get


      # --------------------------------------------------
      # 12. بناء Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        run: |
          flutter build apk \
            --debug \
            --no-tree-shake-icons


      # --------------------------------------------------
      # 13. بناء Release APK
      # --------------------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons


      # --------------------------------------------------
      # 14. بناء Release AAB
      # --------------------------------------------------
      - name: Build Release App Bundle
        run: |
          flutter build appbundle \
            --release \
            --no-tree-shake-icons


      # --------------------------------------------------
      # 15. رفع Debug APK
      # --------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7


      # --------------------------------------------------
      # 16. رفع Release APK
      # --------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7


      # --------------------------------------------------
      # 17. رفع AAB
      # --------------------------------------------------
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
