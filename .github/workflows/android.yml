name: Android CI (build apk/aab)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable' # أو '3.10.6' أو نسخة محددة حسب مشروعك

      - name: Show disk usage (diagnose)
        run: |
          df -h
          du -sh ~/.gradle || true
          du -sh ~/.pub-cache || true

      # optional: clear problematic Gradle jars cache to recover from corrupted jar (uncomment if you want to always clear)
      # - name: Clear problematic Gradle jars cache (optional - increases build time)
      #   run: |
      #     rm -rf ~/.gradle/caches/jars-9 || true
      #     rm -rf ~/.gradle/caches/modules-2/files-2.1 || true

      - name: Cache Pub (Dart/Flutter packages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.pub-cache/hosted
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-v1-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-v1-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Refresh dependencies & assemble debug (with stacktrace)
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF8"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --refresh-dependencies assembleDebug --stacktrace

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/flutter-apk/*.apk

      - name: Upload AAB artifact (release bundle) if exists
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/reports || true
