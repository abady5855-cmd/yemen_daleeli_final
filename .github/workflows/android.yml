name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Yemen Daleeli Android
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Verify Firebase Secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo "ERROR: FIREBASE_CONFIG_JSON secret is missing."
            exit 1
          fi
          echo "Firebase secret exists."

      - name: Create Firebase Config File
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$FIREBASE_CONFIG_JSON" > android/app/google-services.json
          echo "Checking Firebase JSON..."
          python3 - <<'PY'
          import json
          path = "android/app/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          assert "project_info" in data
          assert "client" in data
          print("Firebase JSON is valid.")
          print("Project ID:", data["project_info"]["project_id"])
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        run: flutter test

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get after clean
        run: flutter pub get

      # === التغيير الجذري هنا ===
      - name: Force clean Gradle caches with sudo
        run: |
          sudo rm -rf ~/.gradle/caches
          sudo rm -rf ~/.gradle/daemon
          echo "All Gradle caches removed."

      - name: Verify build environment
        run: |
          java -version
          flutter --version
          cd android
          ./gradlew --version

      # بناء مع خيارات إضافية لتجنب مشاكل Jar
      - name: Build Debug APK
        run: |
          flutter build apk --debug --no-tree-shake-icons --no-daemon --no-build-cache

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --no-daemon --no-build-cache

      - name: Build Release App Bundle
        run: |
          flutter build appbundle --release --no-tree-shake-icons --no-daemon --no-build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
