name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Yemen Daleeli Android
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      # بدون Gradle cache لتجنب استخدام cache تالف
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # 4. التحقق من Firebase Secret
      - name: Verify Firebase Secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo "ERROR: FIREBASE_CONFIG_JSON secret is missing."
            exit 1
          fi

          echo "Firebase secret exists."

      # 5. إنشاء google-services.json
      - name: Create Firebase Config File
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          mkdir -p android/app

          printf '%s' "$FIREBASE_CONFIG_JSON" > android/app/google-services.json

          echo "Checking Firebase JSON..."

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assert "project_info" in data
          assert "client" in data

          print("Firebase JSON is valid.")
          print("Project ID:", data["project_info"]["project_id"])
          PY

      # 6. تثبيت Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. تحليل المشروع
      - name: Analyze code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # 8. الاختبارات
      - name: Run tests
        run: flutter test

      # 9. تنظيف Flutter
      - name: Flutter clean
        run: flutter clean

      # 10. إعادة تثبيت Dependencies
      - name: Flutter pub get after clean
        run: flutter pub get

      # 11. تنظيف Gradle cache في بيئة GitHub Actions
      - name: Reset Gradle caches
        run: |
          rm -rf "$HOME/.gradle/caches"
          rm -rf "$HOME/.gradle/daemon"
          echo "Gradle caches reset successfully."

      # 12. بناء Debug APK
      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      # 13. بناء Release APK
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 14. بناء Release App Bundle
      - name: Build Release App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons

      # 15. رفع Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # 16. رفع Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # 17. رفع Release AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yemen-daleeli-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
